name: Debian 13 package build and tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debian-package:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
    steps:
      - name: Install build and test dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git python3 python3-apt python3-pyqt6 build-essential debhelper dh-python dpkg-dev pkexec polkitd libxml2-utils
      - uses: actions/checkout@v4
      - name: Syntax and translations
        run: |
          PYTHONPATH=src python3 -m unittest discover -s tests -v
          python3 -m compileall -q src helper scripts
          xmllint --noout polkit/in.jatayuos.update-manager.policy
      - name: Build Debian package
        run: dpkg-buildpackage -us -uc -b
      - name: Verify package metadata
        run: dpkg-deb --info ../jatayu-update-manager_1.2.0-1_all.deb
      - name: Upload development package artifact
        uses: actions/upload-artifact@v4
        with:
          name: jatayu-update-manager-debian13
          path: ../jatayu-update-manager_1.2.0-1_all.deb
          if-no-files-found: error
