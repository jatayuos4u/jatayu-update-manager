name: Debian 13 package build and security tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debian-package:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
    steps:
      - name: Install build and test dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git python3 python3-apt python3-pyqt6 build-essential debhelper dh-python dpkg-dev pkexec polkitd libxml2-utils python3-bandit
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run security checks and unit tests
        run: |
          PYTHONPATH=src python3 -m unittest discover -s tests -v
          python3 -m compileall -q src helper scripts
          xmllint --noout polkit/in.jatayuos.update-manager.policy polkit/in.jatayuos.update-manager.supervised.policy
          bandit -q -r src helper -s B404,B603,B607
      - name: Build Debian package
        run: dpkg-buildpackage -us -uc -b
      - name: Verify package metadata and security properties
        run: |
          dpkg-deb --info ../jatayu-update-manager_1.2.3~alpha13-1_all.deb
          dpkg-deb --contents ../jatayu-update-manager_1.2.3~alpha13-1_all.deb | grep -F 'privileged-helper'
      - name: Stage Debian package
        run: |
          mkdir -p artifacts
          cp ../jatayu-update-manager_1.2.3~alpha13-1_all.deb artifacts/
          cd artifacts
          sha256sum jatayu-update-manager_1.2.3~alpha13-1_all.deb > SHA256SUMS
      - name: Upload test artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: jatayu-update-manager-1.2.3-alpha13-handoff-privacy
          path: artifacts/
          if-no-files-found: error
