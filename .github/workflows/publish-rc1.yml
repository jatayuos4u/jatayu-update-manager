name: Publish Jatayu Update Manager RC1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-rc1.yml

permissions:
  contents: write

jobs:
  release-candidate:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
    steps:
      - name: Install build and release prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git curl gh python3 python3-apt python3-pyqt6 build-essential debhelper dh-python dpkg-dev pkexec polkitd libxml2-utils
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Check release target
        run: test "$GITHUB_REF" = "refs/heads/main"
      - name: Test source and policy
        run: |
          PYTHONPATH=src python3 -m unittest discover -s tests -v
          python3 -m compileall -q src helper scripts
          xmllint --noout polkit/in.jatayuos.update-manager.policy
      - name: Build Debian 13 package
        run: dpkg-buildpackage -us -uc -b
      - name: Prepare release files
        run: |
          mkdir -p release
          cp ../jatayu-update-manager_1.2.0-1_all.deb release/
          cd release
          sha256sum jatayu-update-manager_1.2.0-1_all.deb > SHA256SUMS
      - name: Publish GitHub pre-release if absent
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view v1.2.0-rc1 >/dev/null 2>&1; then
            echo "RC1 release already exists; not overwriting."
            exit 0
          fi
          gh release create v1.2.0-rc1             release/jatayu-update-manager_1.2.0-1_all.deb             release/SHA256SUMS             --target "$GITHUB_SHA"             --prerelease             --title "Jatayu Update Manager 1.2.0 RC1"             --notes-file RELEASE_NOTES_1.2.0-rc1.md
