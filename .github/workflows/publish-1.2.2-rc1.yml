name: Publish Jatayu Update Manager 1.2.2 RC1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-1.2.2-rc1.yml

permissions:
  contents: write

jobs:
  release-candidate:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
    steps:
      - name: Install Debian 13 build and publishing dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git gh python3 python3-apt python3-pyqt6 build-essential debhelper dh-python dpkg-dev pkexec polkitd libxml2-utils python3-bandit
      - name: Checkout release source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check intended branch and package version
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          grep -q '^jatayu-update-manager (1.2.2~rc1-1) ' debian/changelog
          test -f assets/jatayu-update-manager.svg
          grep -q '^Icon=jatayu-update-manager$' assets/in.jatayuos.update-manager.desktop
      - name: Test source and Polkit policy
        run: |
          PYTHONPATH=src python3 -m unittest discover -s tests -v
          python3 -m compileall -q src helper scripts
          xmllint --noout polkit/in.jatayuos.update-manager.policy
          xmllint --noout assets/jatayu-update-manager.svg
          bandit -q -r src helper -s B404,B603,B607
      - name: Build and verify Debian package
        run: |
          dpkg-buildpackage -us -uc -b
          dpkg-deb --info ../jatayu-update-manager_1.2.2~rc1-1_all.deb
          dpkg-deb --contents ../jatayu-update-manager_1.2.2~rc1-1_all.deb | grep -F 'privileged-helper'
          dpkg-deb --contents ../jatayu-update-manager_1.2.2~rc1-1_all.deb | grep -F 'jatayu-update-manager.svg'
      - name: Prepare package and checksum
        run: |
          mkdir -p release
          cp ../jatayu-update-manager_1.2.2~rc1-1_all.deb release/
          cd release
          sha256sum 'jatayu-update-manager_1.2.2~rc1-1_all.deb' > SHA256SUMS
      - name: Publish GitHub pre-release only if absent
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view v1.2.2-rc1 >/dev/null 2>&1; then
            echo 'Pre-release already exists; checking the published asset name and checksum.'
            mkdir -p existing-release
            gh release download v1.2.2-rc1 \
              --pattern 'jatayu-update-manager_1.2.2.rc1-1_all.deb' \
              --dir existing-release
            cd existing-release
            sha256sum jatayu-update-manager_1.2.2.rc1-1_all.deb > SHA256SUMS
            cd ..
            gh release upload v1.2.2-rc1 existing-release/SHA256SUMS --clobber
            gh release edit v1.2.2-rc1 \
              --prerelease \
              --notes-file RELEASE_NOTES_1.2.2-rc1.md
            echo 'Updated checksum for the exact published package; original package unchanged.'
            exit 0
          fi
          gh release create v1.2.2-rc1 \
            'release/jatayu-update-manager_1.2.2~rc1-1_all.deb' \
            release/SHA256SUMS \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title 'Jatayu Update Manager 1.2.2 RC1' \
            --notes-file RELEASE_NOTES_1.2.2-rc1.md
