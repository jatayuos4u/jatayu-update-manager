name: Publish Jatayu Update Manager 1.2.2 RC3 (testing only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
    permissions:
      contents: write
    steps:
      - name: Install build and verification tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git gh python3 python3-apt python3-pyqt6 build-essential debhelper dh-python dpkg-dev pkexec polkitd libxml2-utils python3-bandit
      - name: Checkout protected main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Assert explicit testing version and required audit
        run: |
          test "$GITHUB_REF" = 'refs/heads/main'
          head -n 1 debian/changelog | grep -Fx 'jatayu-update-manager (1.2.2~rc3-1) unstable; urgency=medium'
          grep -q 'SEC-01' SECURITY_AUDIT_2026-11-25.md
          test -f RELEASE_NOTES_v1.2.2-rc3.md
          test -f assets/jatayu-update-manager.svg
      - name: Tests, syntax and policy verification
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONPATH: src
        run: |
          python3 -m unittest discover -s tests -v
          python3 -m compileall -q src helper scripts
          xmllint --noout polkit/in.jatayuos.update-manager.policy
          xmllint --noout assets/jatayu-update-manager.svg
          bandit -q -r src helper -s B404,B603,B607
      - name: Build and inspect exact candidate package
        run: |
          dpkg-buildpackage -us -uc -b
          dpkg-deb --info ../jatayu-update-manager_1.2.2~rc3-1_all.deb
          dpkg-deb --contents ../jatayu-update-manager_1.2.2~rc3-1_all.deb | grep -F 'privileged-helper'
          dpkg-deb --contents ../jatayu-update-manager_1.2.2~rc3-1_all.deb | grep -F 'jatayu-update-manager.svg'
      - name: Prepare unmodified package and SHA256 checksum
        run: |
          mkdir -p release
          cp ../jatayu-update-manager_1.2.2~rc3-1_all.deb release/
          cd release
          sha256sum jatayu-update-manager_1.2.2~rc3-1_all.deb > SHA256SUMS
          sha256sum -c SHA256SUMS
      - name: Publish RC3 as pre-release only (never overwrite)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view v1.2.2-rc3 >/dev/null 2>&1; then
            echo 'v1.2.2-rc3 already exists; refusing to overwrite released assets.'
            exit 1
          fi
          gh release create v1.2.2-rc3 \
            release/jatayu-update-manager_1.2.2~rc3-1_all.deb \
            release/SHA256SUMS \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title 'Jatayu Update Manager 1.2.2 RC3 (Testing)' \
            --notes-file RELEASE_NOTES_v1.2.2-rc3.md
