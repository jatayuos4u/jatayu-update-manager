name: Publish Jatayu Update Manager 1.2.1 RC1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-1.2.1-rc1.yml

permissions:
  contents: write

jobs:
  release-candidate:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
    steps:
      - name: Install build and release prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git gh python3 python3-apt python3-pyqt6 build-essential debhelper dh-python dpkg-dev pkexec polkitd libxml2-utils python3-bandit
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify release target and package version
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          grep -q '^jatayu-update-manager (1.2.1-1) ' debian/changelog
      - name: Test source and Polkit policy
        run: |
          PYTHONPATH=src python3 -m unittest discover -s tests -v
          python3 -m compileall -q src helper scripts
          xmllint --noout polkit/in.jatayuos.update-manager.policy
          bandit -q -r src helper -s B404,B603,B607
      - name: Build and validate Debian package
        run: |
          dpkg-buildpackage -us -uc -b
          dpkg-deb --info ../jatayu-update-manager_1.2.1-1_all.deb
          dpkg-deb --contents ../jatayu-update-manager_1.2.1-1_all.deb | grep -F 'privileged-helper'
      - name: Generate release artifacts
        run: |
          mkdir -p release
          cp ../jatayu-update-manager_1.2.1-1_all.deb release/
          cd release
          sha256sum jatayu-update-manager_1.2.1-1_all.deb > SHA256SUMS
      - name: Create prerelease, without overwriting an existing release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view v1.2.1-rc1 >/dev/null 2>&1; then
            echo "Existing tag/release found; leaving it unchanged."
            exit 0
          fi
          gh release create v1.2.1-rc1 \
            release/jatayu-update-manager_1.2.1-1_all.deb \
            release/SHA256SUMS \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Jatayu Update Manager 1.2.1 RC1" \
            --notes-file RELEASE_NOTES_1.2.1-rc1.md
